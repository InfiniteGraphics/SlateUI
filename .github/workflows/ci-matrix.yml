name: CI Matrix

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  matrix-build:
    name: ${{ matrix.loader }} ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: mc1210
            java: '21'
            loader: fabric
            task: ':fabric:build'
          - lane: mc1210
            java: '21'
            loader: neoforge
            task: ':neoforge:build'
          - lane: mc1210
            java: '21'
            loader: forge
            task: ':forge:build'
          - lane: mc1201
            java: '17'
            loader: fabric
            task: ':fabric:build'
          - lane: mc1201
            java: '17'
            loader: forge
            task: ':forge:build'
          - lane: mc1214
            java: '21'
            loader: fabric
            task: ':fabric:build'
          - lane: mc1214
            java: '21'
            loader: neoforge
            task: ':neoforge:build'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/wrapper-validation@v4
      - name: Print lane
        run: ./gradlew -Pslateui.matrixLane=${{ matrix.lane }} printSlateCompatibilityMatrix --stacktrace
      - name: Build lane
        run: ./gradlew -Pslateui.matrixLane=${{ matrix.lane }} ${{ matrix.task }} --stacktrace

  external-consumer:
    name: External consumer examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build SlateUI first
        run: ./gradlew publishToMavenLocal --stacktrace
      - name: Verify consumer source sets exist
        run: test -f examples/consumer-fabric/build.gradle && test -f examples/consumer-neoforge/build.gradle && test -f examples/consumer-forge/build.gradle
